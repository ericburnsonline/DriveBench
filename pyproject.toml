[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drivebench"
version = "0.4.1"
description = "Menu-based Linux utility for drive discovery, diagnostics, wiping, formatting, and persistent history"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
drivebench = "drivebench.cli:main"

[tool.setuptools.packages.find]
include = ["drivebench*"]
